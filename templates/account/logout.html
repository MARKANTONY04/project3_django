{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-4" style="max-width: 450px;">
    <h2 class="text-center">Log Out</h2>
    <p class="text-center mb-4">Are you sure you want to log out?</p>

    <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-danger w-100">Confirm Logout</button>
    </form>

    <p class="text-center mt-3">
        <a href="/">Return Home</a>
    </p>
</div>
{% endblock %}
