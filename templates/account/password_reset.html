{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-4" style="max-width: 450px;">
    <h2 class="text-center mb-3">Reset Password</h2>

    <form method="post" action="{% url 'account_reset_password' %}">
        {% csrf_token %}
        {{ form|crispy }}

        <button type="submit" class="btn btn-primary w-100 mt-2">Reset Password</button>
    </form>

    <p class="text-center mt-3">
        <a href="{% url 'account_login' %}">Back to Login</a>
    </p>
</div>
{% endblock %}
