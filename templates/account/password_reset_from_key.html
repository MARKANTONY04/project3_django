{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-4" style="max-width: 450px;">
    <h2 class="text-center mb-3">Choose a New Password</h2>

    {% if token_fail %}
        <p class="text-danger text-center">The link is invalid or expired.</p>
    {% else %}
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}

            <button type="submit" class="btn btn-success w-100">Change Password</button>
        </form>
    {% endif %}
</div>
{% endblock %}
