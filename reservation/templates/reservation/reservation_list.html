{% extends 'base.html' %}
{% block content %}
<h2>My Reservations</h2>

{% if reservations %}
<table class="table">
    <thead>
        <tr>
            <th>Date</th><th>Time</th><th>Guests</th><th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for r in reservations %}
        <tr>
            <td>{{ r.date }}</td>
            <td>{{ r.time }}</td>
            <td>{{ r.number_of_guests }}</td>
            <td>
                <a href="{% url 'reservation:edit_reservation' r.pk %}" class="btn btn-sm btn-primary">Edit</a>
                <a href="{% url 'reservation:delete_reservation' r.pk %}" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<p>You have no reservations.</p>
{% endif %}

{% endblock %}
