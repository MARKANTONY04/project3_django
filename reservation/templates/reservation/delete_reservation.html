{% extends 'base.html' %}
{% block content %}
<h2>Delete Reservation</h2>
<p>Are you sure you want to delete your reservation on <strong>{{ reservation.date }} at {{ reservation.time }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'reservation:reservation_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
